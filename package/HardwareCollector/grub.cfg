insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod search_fs_file
insmod search_fs_uuid
insmod probe
insmod linux
insmod chain
insmod all_video
search --no-floppy --file --set=root /HardwareCollector/identity-3eead5ee-b941-4925-b314-5ac6d8a24ad1
set timeout=-1
set default=0
terminal_output console

menuentry 'Collect hardware automatically - offline Linux' {
    probe --set=usb_uuid --fs-uuid ($root)
    linux /HardwareCollector/live/boot/x86_64/vmlinuz archisodevice=/dev/disk/by-uuid/$usb_uuid archisobasedir=HardwareCollector/live nomdlvm noswap ar_nowait quiet loglevel=3 systemd.show_status=false systemd.mask=NetworkManager.service systemd.mask=NetworkManager-wait-online.service systemd.mask=sshd.service console=tty0
    initrd /HardwareCollector/live/boot/intel_ucode.img /HardwareCollector/live/boot/amd_ucode.img /HardwareCollector/live/boot/x86_64/sysresccd.img
}

menuentry 'macOS / OpenCore - existing EFI' {
    chainloader /EFI/OC/OpenCore.efi
}

menuentry 'Collect hardware - basic display fallback (panel details may be missing)' {
    probe --set=usb_uuid --fs-uuid ($root)
    linux /HardwareCollector/live/boot/x86_64/vmlinuz archisodevice=/dev/disk/by-uuid/$usb_uuid archisobasedir=HardwareCollector/live nomdlvm noswap nomodeset ar_nowait quiet loglevel=3 systemd.show_status=false systemd.mask=NetworkManager.service systemd.mask=NetworkManager-wait-online.service systemd.mask=sshd.service console=tty0
    initrd /HardwareCollector/live/boot/intel_ucode.img /HardwareCollector/live/boot/amd_ucode.img /HardwareCollector/live/boot/x86_64/sysresccd.img
}

menuentry 'Return to firmware' {
    exit
}
